apiVersion: apps/v1
kind: Deployment
metadata: {name: irrigation-api, labels: {app: irrigation-api}}
spec:
  replicas: 3
  selector: {matchLabels: {app: irrigation-api}}
  template:
    metadata: {labels: {app: irrigation-api}}
    spec:
      containers:
      - name: api
        image: irrigation-api:1.0
        imagePullPolicy: Never
        ports: [{containerPort: 5000}]
        env:
        - {name: DB_HOST, value: mysql}
        - {name: REDIS_HOST, value: redis}
        - {name: DB_USER, valueFrom: {secretKeyRef: {name: irrig-secret, key: DB_USER}}}
        - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: irrig-secret, key: DB_PASSWORD}}}
        readinessProbe: {httpGet: {path: /health, port: 5000}, initialDelaySeconds: 5, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /metrics, port: 5000}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: irrigation-api, labels: {app: irrigation-api}}
spec:
  type: NodePort
  selector: {app: irrigation-api}
  ports: [{name: http, port: 5000, targetPort: 5000, nodePort: 30080}]
